name: Test

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    name: Typecheck, Lint, Unit Tests
    runs-on: ubuntu-latest
    env:
      SKIP_IOS_FRAMEWORK_DOWNLOAD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage thresholds)
        run: npm test

      - name: Nitrogen codegen drift check
        run: |
          npm run specs
          if ! git diff --quiet -- nitrogen/generated; then
            echo "::error::nitrogen/generated is out of date. Run 'npx nitrogen' and commit the result."
            git diff --stat -- nitrogen/generated
            exit 1
          fi

      - name: Framework release guardrail
        run: npm run check-framework-release

  android-unit-tests:
    name: Android Unit Tests (Robolectric)
    runs-on: ubuntu-latest
    env:
      SKIP_IOS_FRAMEWORK_DOWNLOAD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # litertlm-android is built for Java 21, so the Robolectric test JVM
      # must be 21+ (see android/build.gradle toolchain block).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install example dependencies
        run: npm install
        working-directory: example

      # nitrogen/generated is codegen output and not checked in
      - name: Generate Nitro bindings
        run: npm run specs

      # example/android is Expo prebuild output and not checked in
      - name: Generate android project
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      - name: Run Robolectric unit tests
        run: ./gradlew :react-native-litert-lm:testDebugUnitTest
        working-directory: example/android
