name: LiteRT-LM Release Watch

# LiteRT-LM ships roughly monthly. This job compares the latest upstream
# release against the version pinned in package.json (litertLm.version) and
# opens an issue with the C-header API diff when a new release appears.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare pinned vs latest release
        id: compare
        run: |
          PINNED=$(node -p "require('./package.json').litertLm.version")
          LATEST_TAG=$(curl -fsSL https://api.github.com/repos/google-ai-edge/LiteRT-LM/releases/latest | node -p "JSON.parse(require('fs').readFileSync(0)).tag_name")
          LATEST=${LATEST_TAG#v}
          echo "pinned=$PINNED"  >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"  >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build C-header API diff
        if: steps.compare.outputs.outdated == 'true'
        run: |
          PINNED_TAG="v${{ steps.compare.outputs.pinned }}"
          LATEST_TAG="${{ steps.compare.outputs.latest_tag }}"
          # Since v0.17 the public C API spans every non-internal header in c/
          # (engine, conversation, model_info, embedding_engine, error_reporter,
          # experimental, ...) — diffing engine.h alone misses most changes.
          list_headers() {
            curl -fsSL "https://api.github.com/repos/google-ai-edge/LiteRT-LM/contents/c?ref=$1" \
              | node -e 'for (const f of JSON.parse(require("fs").readFileSync(0))) if (f.name.endsWith(".h") && !/_internal|_test/.test(f.name)) console.log(f.name)' \
              || true
          }
          HEADERS=$( { list_headers "$PINNED_TAG"; list_headers "$LATEST_TAG"; } | sort -u )
          mkdir -p old new
          for h in $HEADERS; do
            curl -fsSL "https://raw.githubusercontent.com/google-ai-edge/LiteRT-LM/$PINNED_TAG/c/$h" -o "old/$h" || : > "old/$h"
            curl -fsSL "https://raw.githubusercontent.com/google-ai-edge/LiteRT-LM/$LATEST_TAG/c/$h" -o "new/$h" || : > "new/$h"
          done
          symbols() { cat "$1"/*.h | tr '\n' ' ' | grep -oE 'litert_lm_[a-z0-9_]+ *\(' | tr -d ' (' | sort -u; }
          symbols old > old.syms
          symbols new > new.syms
          {
            echo "### C API symbols ($PINNED_TAG → $LATEST_TAG)"
            echo
            echo 'Removed (breaking if `ios/*.swift` calls any):'
            echo '```'
            comm -23 old.syms new.syms || true
            echo '```'
            echo 'Added:'
            echo '```'
            comm -13 old.syms new.syms || true
            echo '```'
            for h in $HEADERS; do
              cmp -s "old/$h" "new/$h" && continue
              echo
              echo "<details><summary><code>c/$h</code></summary>"
              echo
              echo '```diff'
              diff -u "old/$h" "new/$h" | head -150 || true
              echo '```'
              echo '</details>'
            done
          } > header-diff-full.md
          # GitHub caps issue bodies at 65,536 characters.
          head -c 55000 header-diff-full.md > header-diff.md
          if [ "$(wc -c < header-diff-full.md)" -gt 55000 ]; then
            printf '\n\n_…truncated — diff the tags locally for the rest._\n' >> header-diff.md
          fi

      - name: Open (or skip existing) upgrade issue
        if: steps.compare.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Upgrade LiteRT-LM to ${{ steps.compare.outputs.latest_tag }}"
          EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Issue already open — skipping."
            exit 0
          fi
          {
            echo "Upstream released **${{ steps.compare.outputs.latest_tag }}**; this package pins **v${{ steps.compare.outputs.pinned }}**."
            echo
            echo "Checklist (see docs/LiteRT-LM v0.18.0 Upgrade.md for the pattern):"
            echo "- [ ] Bump \`litertLm\` versions in package.json (postinstall replaces \`ios/Frameworks\` when the pinned tag changes)"
            echo "- [ ] Confirm every C symbol \`ios/*.swift\` calls is exported by both framework slices (\`nm -gU\`)"
            echo "- [ ] Review the C API diff below for breaking changes"
            echo "- [ ] Verify the Android Kotlin API (javap the new AAR) and its Kotlin metadata version against the app.plugin.js pin"
            echo "- [ ] Run the on-device integration suites + benchmarks (ios/Tests, android/src/androidTest)"
            echo "- [ ] Run the on-device memory scenarios (scripts/device-memory-scenarios.md)"
            echo
            cat header-diff.md
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md --label dependencies
